# Perfil JF · servidor da sala (Cloudflare Workers, plano grátis). Como publicar: LEIA-ME.md
name = "perfil-jf-sala"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# sites que podem pedir a lista de salas e a ponte (separados por vírgula). O arquivo offline e o localhost já valem.
# Domínio próprio: acrescente aqui ANTES de trocar o endereço (ex.: "https://jfsouza77.github.io,https://www.dominio.com.br").
ORIGENS = "https://jfsouza77.github.io"

[[durable_objects.bindings]]
name = "SINAL"
class_name = "Sinal"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sinal"]

# 11/2026: logs do servidor guardados no painel do Cloudflare (Workers Logs, grátis). Pra ver: Workers & Pages →
# perfil-jf-sala → Logs. Os erros aparecem como "erro no servidor" (com o caminho e o motivo).
[observability]
enabled = true
