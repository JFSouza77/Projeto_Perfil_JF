# Perfil JF · servidor da sala (Cloudflare Workers, plano grátis). Como publicar: LEIA-ME.md
name = "perfil-jf-sala"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# sites que podem pedir a lista de salas e a ponte (separados por vírgula). O arquivo offline e o localhost já valem.
