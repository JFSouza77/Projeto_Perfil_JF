<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C.A.O.S. formas</title>
<style>
  :root { --bg:#0b0d14; --cor:#3ef0ff; --texto:#e8ecf5; --suave:#8a93a8; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 35%, #161a2a 0, var(--bg) 70%); color:var(--texto);
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px; }
  h1 { font-size:20px; letter-spacing:.2em; margin:0 0 2px; color:var(--cor); text-shadow:0 0 12px var(--cor); transition:color .5s, text-shadow .5s; }
  .sub { color:var(--suave); font-size:13px; margin:0 0 4px; }
  .forma-nome { font-size:15px; font-weight:700; color:var(--cor); margin:0; min-height:20px; transition:color .5s; }
  svg { width:min(360px, 90vw); height:auto; overflow:visible; }
  #flutua { animation:boia 3.2s ease-in-out infinite; }
  @keyframes boia { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  #forma, .acc, #rosto { transform-box:fill-box; transform-origin:center; }
  #forma { transition:transform .7s cubic-bezier(.3,1.4,.5,1); }
  #forma.treme { animation:treme .18s linear infinite; }
  @keyframes treme { 0%{translate:0 0} 25%{translate:2px -1px} 50%{translate:-2px 1px} 75%{translate:1px 2px} 100%{translate:0 0} }
  .acc { opacity:0; transform:scale(.4); transition:opacity .45s, transform .6s cubic-bezier(.3,1.5,.5,1); }
  .acc.on { opacity:1; transform:scale(1); }
  #rosto { transition:opacity .15s; }
  #rosto.troca { opacity:0; }
  .neon { stroke:var(--cor); filter:url(#brilho); transition:stroke .5s, fill .5s; }
  #olhos { transform-box:fill-box; transform-origin:center; transition:transform .08s; }
  #olhos.pisca { transform:scaleY(.1); }
  #aureola { animation:aureola 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes aureola { 0%,100% { translate:0 0; } 50% { translate:0 -5px; } }
  .asa { transform-box:fill-box; animation:bate 1.4s ease-in-out infinite; }
  #asaE { transform-origin:right center; } #asaD { transform-origin:left center; }
  @keyframes bate { 0%,100% { rotate:0deg; } 50% { rotate:-12deg; } }
  #asaD { animation-name:bateD; } @keyframes bateD { 0%,100% { rotate:0deg; } 50% { rotate:12deg; } }
  .gota { animation:gota 1.1s linear infinite; }
  @keyframes gota { from { translate:0 0; opacity:1; } to { translate:0 34px; opacity:0; } }
  #lagrima { animation:lagrima 2.2s ease-in infinite; }
  @keyframes lagrima { 0% { translate:0 0; opacity:0; } 20% { opacity:1; } 100% { translate:0 26px; opacity:0; } }
  #raios { animation:pisca-sirene .5s steps(2) infinite; }
  @keyframes pisca-sirene { 50% { opacity:.1; } }
  #lampada-luz { animation:ideia 1.6s ease-in-out infinite; }
  @keyframes ideia { 50% { opacity:.35; } }
  #coracao { transform-box:fill-box; transform-origin:center; animation:pulsa 1.1s ease-in-out infinite; fill:color-mix(in srgb, var(--cor) 35%, transparent); }
  @keyframes pulsa { 0%,100% { scale:1; } 15% { scale:1.18; } 30% { scale:1; } 45% { scale:1.12; } }
  #despertador { transform-box:fill-box; transform-origin:center bottom; animation:toca 1.6s ease-in-out infinite; }
  @keyframes toca { 0%,40%,100% { rotate:0deg; } 5%,15%,25%,35% { rotate:-12deg; } 10%,20%,30% { rotate:12deg; } }
  .grupo { width:100%; text-align:center; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--suave); margin:8px 0 0; }
  #moeda { animation:moeda 1.8s ease-in infinite; }
  @keyframes moeda { 0% { translate:0 -10px; opacity:0; } 20% { opacity:1; } 70% { translate:0 30px; opacity:1; } 100% { translate:0 32px; opacity:0; } }
  .fedor { animation:fedor 2s ease-in-out infinite; }
  @keyframes fedor { 0% { translate:0 6px; opacity:0; } 40% { opacity:1; } 100% { translate:0 -10px; opacity:0; } }
  #suor { animation:suor 2.4s ease-in infinite; }
  @keyframes suor { 0% { translate:0 0; opacity:0; } 20% { opacity:1; } 100% { translate:0 22px; opacity:0; } }
  #pupilas { animation:treme .12s linear infinite; }
  #forma.nega { animation:nega 1.6s ease-in-out infinite; }
  @keyframes nega { 0%,60%,100% { translate:0 0; } 10%,30%,50% { translate:-6px 0; } 20%,40% { translate:6px 0; } }
  #lupa { transform-box:fill-box; transform-origin:center; animation:lupa 3s ease-in-out infinite; }
  @keyframes lupa { 0%,100% { translate:0 0; } 50% { translate:-4px 3px; } }
  #joinha { transform-box:fill-box; transform-origin:center bottom; animation:joinha 1.8s ease-in-out infinite; }
  @keyframes joinha { 0%,70%,100% { rotate:0deg; } 80% { rotate:-10deg; } 90% { rotate:6deg; } }
  #microfone { transform-box:fill-box; transform-origin:right bottom; animation:mic 1.2s ease-in-out infinite; }
  @keyframes mic { 0%,100% { rotate:0deg; } 50% { rotate:8deg; } }
  #nariz { transform-box:fill-box; transform-origin:center; animation:pulsa 1.4s ease-in-out infinite; }
  #ponteiro { transform-box:view-box; transform-origin:342px 198px; animation:ponteiro .9s ease-in-out infinite; }
  @keyframes ponteiro { 0%,100% { rotate:0deg; } 50% { rotate:-7deg; } }
  #seta { stroke-dasharray:140; animation:sobe 2.4s ease-out infinite; }
  @keyframes sobe { 0% { stroke-dashoffset:140; } 60%,100% { stroke-dashoffset:0; } }
  #forma.ri { animation:ri .5s ease-in-out infinite; }
  @keyframes ri { 0%,100% { translate:0 0; } 50% { translate:0 -5px; } }
  #bola { transform-box:fill-box; transform-origin:center; animation:mistico 2.2s ease-in-out infinite; }
  @keyframes mistico { 0%,100% { opacity:.75; scale:1; } 50% { opacity:1; scale:1.06; } }
  #forma.levita { animation:levita 4.5s ease-in-out infinite; }
  @keyframes levita { 0%,100% { translate:0 0; } 50% { translate:0 -16px; } }
  #forma.cambaleia { animation:cambaleia 3.2s ease-in-out infinite; }
  @keyframes cambaleia { 0%,100% { rotate:-4deg; } 50% { rotate:5deg; } }
  #forma.varre #lupa { animation:varre 2.6s ease-in-out infinite; }
  @keyframes varre { 0%,100% { translate:0 0; } 50% { translate:-80px 0; } }
  #curto { animation:pisca-sirene .25s steps(2) infinite; }
  #pino { transform-box:fill-box; transform-origin:center bottom; animation:pino 1s ease-in-out infinite; }
  @keyframes pino { 0%,100% { translate:0 0; } 50% { translate:0 -8px; } }
  #rota { animation:rota .8s linear infinite; }
  @keyframes rota { to { stroke-dashoffset:-20; } }
  #cena { margin-top:8px; }
  .z { animation:zzz 2.1s ease-in-out infinite; opacity:0; }
  @keyframes zzz { 0% { translate:0 8px; opacity:0; } 30% { opacity:1; } 100% { translate:6px -12px; opacity:0; } }
  #forma.respira { animation:respira 3.6s ease-in-out infinite; }
  @keyframes respira { 0%,100% { scale:1; } 50% { scale:1.03 .97; } }
  #forma.balanca { animation:balanca 3s ease-in-out infinite; }
  @keyframes balanca { 0%,100% { rotate:-3deg; } 50% { rotate:3deg; } }
  #forma.encolhe { animation:encolhe 2.4s ease-in-out infinite; }
  @keyframes encolhe { 0%,100% { translate:0 0; } 50% { translate:4px 2px; } }
  #fita { animation:fita 1.2s linear infinite; }
  @keyframes fita { to { stroke-dashoffset:-16; } }
  #sol { transform-box:fill-box; transform-origin:center; animation:gira 12s linear infinite; }
  @keyframes gira { to { rotate:360deg; } }
  #leque { transform-box:fill-box; transform-origin:center bottom; animation:leque 2.6s ease-in-out infinite; }
  @keyframes leque { 0%,100% { rotate:0deg; } 50% { rotate:-6deg; } }
  #tesoura { transform-box:fill-box; transform-origin:left center; animation:corta .7s ease-in-out infinite; }
  @keyframes corta { 0%,100% { scale:1 1; } 50% { scale:1 .55; } }
  #caneta { transform-box:fill-box; transform-origin:right top; animation:bate-caneta .9s ease-in-out infinite; }
  @keyframes bate-caneta { 0%,100% { rotate:0deg; } 50% { rotate:-14deg; } }
  #chama { transform-box:fill-box; transform-origin:center bottom; animation:chama 1s ease-in-out infinite; }
  @keyframes chama { 0%,100% { scale:1 1; } 50% { scale:.94 1.08; } }
  @keyframes pesa { 0%,100% { rotate:-8deg; } 50% { rotate:8deg; } }
  #olhar { transition:transform .35s ease-out; }
  .gira { transform-box:fill-box; transform-origin:center; animation:gira 1.1s linear infinite; }
  .falando { transform-box:fill-box; transform-origin:center; animation:mexeBoca .16s ease-in-out infinite alternate; }
  @keyframes mexeBoca { from { scale:1 1; } to { scale:1.06 .5; } }
  #fala.digitando::after { content:'▍'; animation:pisca-sirene .8s steps(2) infinite; }
  .tecla { animation:tecla 1.9s steps(1) infinite; opacity:.35; }
  @keyframes tecla { 0%,100% { opacity:.3; } 12% { opacity:1; } 24% { opacity:.3; } }
  #fitaSobe { animation:fitaSobe 1.6s ease-in-out infinite; }
  @keyframes fitaSobe { 0%,100% { translate:0 0; } 50% { translate:0 -12px; } }
  .mexe { transform-box:fill-box; transform-origin:center; animation-duration:2.6s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
  .mexe-balanca { animation-name:mx-balanca; } @keyframes mx-balanca { 0%,100% { rotate:-6deg; } 50% { rotate:6deg; } }
  .mexe-sobe { animation-name:mx-sobe; } @keyframes mx-sobe { 0%,100% { translate:0 0; } 50% { translate:0 -5px; } }
  .mexe-pulsa { animation-name:mx-pulsa; } @keyframes mx-pulsa { 0%,100% { scale:1; } 50% { scale:1.08; } }
  .mexe-vaivem { animation-name:mx-vaivem; animation-duration:1.2s; } @keyframes mx-vaivem { 0%,100% { scale:1; rotate:0deg; } 50% { scale:1.15; rotate:-8deg; } }
  .mexe-bate { transform-origin:center bottom; animation-name:mx-bate; animation-duration:1.4s; } @keyframes mx-bate { 0%,60%,100% { rotate:0deg; } 70% { rotate:-12deg; } 85% { rotate:4deg; } }
  .mexe-lingua { transform-origin:left top; animation-name:mx-lingua; animation-duration:.9s; } @keyframes mx-lingua { 0%,100% { rotate:-10deg; } 50% { rotate:14deg; } }
  .mexe-bigode { animation-name:mx-bigode; animation-duration:1.8s; } @keyframes mx-bigode { 0%,100% { rotate:0deg; scale:1; } 30% { rotate:3deg; } 60% { rotate:-3deg; scale:1.04 1; } }
  #sobrancelhas { transform-box:fill-box; transform-origin:center; transition:transform .35s ease-out, translate .35s; }
  #boca.oscila { transform-box:fill-box; transform-origin:center; animation:oscila 3.4s ease-in-out infinite; }
  @keyframes oscila { 0%,100% { scale:1 1; } 40% { scale:1.04 .9; } 70% { scale:.97 1.06; } }
  #boca.tremula { transform-box:fill-box; transform-origin:center; animation:treme .1s linear infinite; }
  #forma.trocaOlho #lupa { animation:trocaOlho 4s ease-in-out infinite; }
  @keyframes trocaOlho { 0%,40% { translate:0 0; } 50%,90% { translate:-78px 0; } 100% { translate:0 0; } }
  .cresce { transform-box:fill-box; transform-origin:center bottom; animation:cresce 2.2s ease-out infinite; }
  @keyframes cresce { 0% { scale:1 .3; } 60%,100% { scale:1 1; } }
  .brilhinho { transform-box:fill-box; transform-origin:center; animation:brilhinho 1.6s ease-in-out infinite; }
  @keyframes brilhinho { 0%,100% { scale:.4; opacity:.3; } 50% { scale:1.2; opacity:1; } }
  .fumo { animation:fumo 1.2s ease-out infinite; }
  @keyframes fumo { 0% { translate:0 6px; opacity:0; } 30% { opacity:1; } 100% { translate:0 -14px; opacity:0; } }
  .fala { margin:4px 0 14px; max-width:340px; background:#151a28; border:1px solid #262d42; border-radius:14px;
    padding:12px 14px; font-size:15px; line-height:1.4; min-height:48px; text-align:center; }
  .botoes { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:420px; }
  button { background:#151a28; color:var(--texto); border:1px solid #2a3148; border-radius:999px; padding:10px 14px;
    font-size:15px; min-height:44px; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--cor); box-shadow:0 0 10px var(--cor); }
  #passear { margin-top:10px; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; } #forma { transition:none; } }
</style>
</head>
<body>
  <h1>C.A.O.S.</h1>
  <p class="sub">rascunho do Wally · a forma muda com o humor, o momento e a reação</p>
  <p class="forma-nome" id="formaNome"></p>

  <svg viewBox="0 0 400 400" role="img" aria-labelledby="formaNome">
    <defs>
      <filter id="brilho" filterUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="520">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g id="particulas"></g>

    <g id="flutua"><g id="forma">
      <!-- ANJINHO: asas e auréola -->
      <g class="acc" data-acc="asas">
        <path id="asaE" class="asa neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round"
              d="M104 196 C 72 160, 34 168, 40 198 C 44 222, 72 232, 104 226 C 86 218, 74 210, 104 210 Z"/>
        <path id="asaD" class="asa neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round"
              d="M296 196 C 328 160, 366 168, 360 198 C 356 222, 328 232, 296 226 C 314 218, 326 210, 296 210 Z"/>
      </g>
      <g class="acc" data-acc="aureola"><ellipse id="aureola" class="neon" cx="200" cy="108" rx="48" ry="10" fill="none" stroke-width="5"/></g>

      <!-- CAPETINHA: chifres e rabo -->
      <g class="acc" data-acc="chifres">
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round" d="M132 140 L122 96 L158 134 Z"/>
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round" d="M242 134 L262 104 L276 112 L268 140 Z"/>
        <circle id="faisca" class="neon" cx="279" cy="100" r="4" stroke-width="2" fill="none"/>
      </g>
      <g class="acc" data-acc="rabo">
        <path class="neon" fill="none" stroke-width="5" stroke-linecap="round" d="M262 282 C 300 320, 250 345, 292 362"/>
        <path class="neon" fill="#0f1320" stroke-width="3" stroke-linejoin="round" d="M284 352 L306 366 L282 374 Z"/>
      </g>

      <!-- ORGULHOSO: coroa, monóculo e gravata-borboleta -->
      <g class="acc" data-acc="coroa">
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round" transform="rotate(-9 200 120)"
              d="M162 140 L166 100 L184 120 L200 92 L216 120 L234 100 L238 140 Z"/>
        <circle class="neon" cx="200" cy="124" r="4" fill="none" stroke-width="2" transform="rotate(-9 200 120)"/>
      </g>
      <g class="acc" data-acc="gravata">
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round" d="M200 298 L174 284 L174 312 Z M200 298 L226 284 L226 312 Z"/>
        <circle class="neon" cx="200" cy="298" r="5" fill="#0f1320" stroke-width="3"/>
      </g>

      <!-- FELIZ: chapéu de festa -->
      <g class="acc" data-acc="chapeu">
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round" transform="rotate(12 200 120)" d="M176 140 L200 78 L224 140 Z"/>
        <path class="neon" fill="none" stroke-width="3" transform="rotate(12 200 120)" d="M186 116 L214 116 M193 98 L207 98"/>
        <circle class="neon" cx="213" cy="76" r="7" fill="none" stroke-width="3"/>
      </g>

      <!-- PENSANDO: lâmpada na antena -->
      <g class="acc" data-acc="lampada">
        <path class="neon" fill="none" stroke-width="4" stroke-linecap="round" d="M200 136 L200 116"/>
        <circle id="lampada-luz" class="neon" cx="200" cy="100" r="13" fill="none" stroke-width="4"/>
        <path class="neon" fill="none" stroke-width="3" d="M194 113 h12"/>
      </g>

      <!-- TRISTE: nuvem de chuva -->
      <g class="acc" data-acc="nuvem">
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round"
              d="M150 96 C 136 96, 132 76, 148 72 C 150 56, 174 52, 182 66 C 192 50, 222 54, 222 74 C 240 72, 248 96, 230 96 Z"/>
        <path class="gota neon" stroke-width="3" stroke-linecap="round" d="M166 104 v8"/>
        <path class="gota neon" stroke-width="3" stroke-linecap="round" d="M190 104 v8" style="animation-delay:.35s"/>
        <path class="gota neon" stroke-width="3" stroke-linecap="round" d="M214 104 v8" style="animation-delay:.7s"/>
      </g>

      <!-- ALERTA: sirene -->
      <g class="acc" data-acc="sirene">
        <path class="neon" fill="#0f1320" stroke-width="4" stroke-linejoin="round" d="M178 136 Q 178 104, 200 104 Q 222 104, 222 136 Z"/>
        <g id="raios"><path class="neon" fill="none" stroke-width="4" stroke-linecap="round" d="M160 104 l-14 -8 M240 104 l14 -8 M200 92 v-14"/></g>
      </g>

      <!-- CARTEIRA · PROFESSOR: capelo, lousinha com gráfico e varinha -->
      <g class="acc" data-acc="lousa">
        <rect class="neon" x="312" y="146" width="62" height="50" rx="6" fill="#0f1320" stroke-width="4"/>
        <path class="neon" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M320 186 L334 174 L346 180 L364 158 M356 158 h8 v8"/>
        <path class="neon" fill="none" stroke-width="3" stroke-linecap="round" d="M292 248 L320 200"/>
      </g>

      <!-- CARTEIRA · PARCEIRO (mês apertado): cachecol e coração -->
      <g class="acc" data-acc="coracao"><path id="coracao" class="neon" stroke-width="3" d="M318 150 C 292 132, 300 108, 318 120 C 336 108, 344 132, 318 150 Z"/></g>

      <!-- CARTEIRA · BRONCA (passou do limite): cartão amarelo -->
      <g class="acc" data-acc="cartao">
        <rect x="308" y="140" width="42" height="58" rx="6" fill="#ffd400" stroke="#ffd400" stroke-width="3" filter="url(#brilho)" transform="rotate(14 329 169)"/>
        <path class="neon" fill="none" stroke-width="5" stroke-linecap="round" d="M292 236 Q 312 220, 318 196"/>
      </g>

      <!-- CARTEIRA · LEMBRETE (conta vencendo): despertador -->
      <g class="acc" data-acc="despertador">
        <g id="despertador">
          <circle class="neon" cx="200" cy="100" r="20" fill="#0f1320" stroke-width="4"/>
          <path class="neon" fill="none" stroke-width="4" stroke-linecap="round" d="M176 88 a 12 12 0 0 1 14 -14 M224 88 a 12 12 0 0 0 -14 -14"/>
          <path class="neon" fill="none" stroke-width="3" stroke-linecap="round" d="M200 100 v-11 M200 100 h8 M186 118 l-6 9 M214 118 l6 9"/>
        </g>
      </g>

      <!-- REAÇÕES · ECONOMISTA: cofrinho com moeda caindo -->
      <g class="acc" data-acc="cofrinho">
        <circle id="moeda" class="neon" cx="338" cy="214" r="8" fill="#0f1320" stroke-width="3"/>
        <ellipse class="neon" cx="340" cy="262" rx="30" ry="21" fill="#0f1320" stroke-width="4"/>
        <path class="neon" fill="#0f1320" stroke-width="3" stroke-linejoin="round" d="M326 246 l4 -12 l10 9"/>
        <rect class="neon" x="368" y="255" width="9" height="13" rx="3" fill="#0f1320" stroke-width="3"/>
        <path class="neon" fill="none" stroke-width="3" stroke-linecap="round" d="M330 242 h16 M326 280 v8 M352 280 v8"/>
        <circle cx="356" cy="256" r="2.5" fill="var(--cor)"/>
      </g>
      <!-- REAÇÕES · NOJINHO: cheirinho ruim -->
      <g class="acc" data-acc="fedor">
        <path class="fedor neon" fill="none" stroke-width="3" stroke-linecap="round" d="M118 150 q 7 -8 0 -16 t 0 -16"/>
        <path class="fedor neon" fill="none" stroke-width="3" stroke-linecap="round" d="M96 166 q 7 -8 0 -16 t 0 -16" style="animation-delay:.5s"/>
        <path class="fedor neon" fill="none" stroke-width="3" stroke-linecap="round" d="M140 134 q 7 -8 0 -16 t 0 -16" style="animation-delay:1s"/>
      </g>

      <!-- REAÇÕES · AMIGÃO: alvo da meta e joinha -->
      <g class="acc" data-acc="alvo">
        <circle class="neon" cx="344" cy="166" r="26" fill="#0f1320" stroke-width="4"/>
        <circle class="neon" cx="344" cy="166" r="15" fill="none" stroke-width="3"/>
        <circle cx="344" cy="166" r="5" fill="var(--cor)"/>
        <path id="flecha" class="neon" fill="none" stroke-width="4" stroke-linecap="round" d="M300 214 L 340 170 M300 214 l -4 -12 M300 214 l 12 -2"/>
      </g>
      <g class="acc" data-acc="bilhete">
        <path class="neon" fill="#0f1320" stroke-width="3" stroke-linejoin="round" transform="rotate(-8 74 232)" d="M44 200 h58 v52 l -12 12 h -46 z M102 252 h -12 v 12"/>
        <text x="73" y="222" text-anchor="middle" font-size="11" font-weight="900" fill="var(--cor)" transform="rotate(-8 74 232)">DICA</text>
        <text x="73" y="242" text-anchor="middle" font-size="13" font-weight="900" fill="var(--cor)" transform="rotate(-8 74 232)">+R$210</text>
        <path class="neon" fill="none" stroke-width="2" stroke-linecap="round" transform="rotate(-8 74 232)" d="M54 252 h30"/>
      </g>

      <!-- ESTILOS · HUMORISTA: microfone -->
      <g class="acc" data-acc="microfone"><g id="microfone">
        <path class="neon" fill="none" stroke-width="7" stroke-linecap="round" d="M80 228 L 100 266"/>
        <circle class="neon" cx="72" cy="212" r="16" fill="#0f1320" stroke-width="4"/>
        <path class="neon" fill="none" stroke-width="2" d="M60 206 h24 M58 214 h28 M62 222 h20"/>

const $ = id => document.getElementById(id);
let atual = 'anjinho';

function desenharRosto(f) {
  for (const lado of ['olhoE', 'olhoD']) {
    $(lado).setAttribute('d', f[lado].d);
    $(lado).style.fill = f[lado].cheio ? f.cor : 'none';
  }
  $('sobrancelhas').setAttribute('d', f.sob || 'M0 0');
  $('sobrancelhas').style.display = f.sob ? '' : 'none';
  $('boca').setAttribute('d', f.boca || 'M0 0');
  $('boca').style.display = f.boca ? '' : 'none';
  $('boca').style.fill = f.boca.endsWith('Z') ? '#0f1320' : 'none';
  $('extra').textContent = f.extra;
  for (const lado of ['olhoE', 'olhoD']) $(lado).classList.toggle('gira', !!f.gira && !parado);
  $('boca').classList.toggle('oscila', !parado && !f.bocaTreme);
  $('boca').classList.toggle('tremula', !parado && !!f.bocaTreme);
}

// ---------- vida: boca que fala, texto aparecendo, olhar que passeia ----------
let falaTimer = null;
function falar(texto) {
  clearInterval(falaTimer);
  const bocas = ['boca', 'bigodeVivo'].map(id => document.getElementById(id)).filter(Boolean);
  const el = $('fala');
  if (parado) { el.textContent = texto; return; }
  let i = 0;
  el.textContent = '';
  el.classList.add('digitando');
  bocas.forEach(b => b.classList.add('falando'));
  falaTimer = setInterval(() => {
    i += 2;
    el.textContent = texto.slice(0, i);
    if (i >= texto.length) {
      clearInterval(falaTimer);
      el.classList.remove('digitando');
      bocas.forEach(b => b.classList.remove('falando'));
    }
  }, 35);
}
let lado = 1;
(function passeiaOlhar() {
  setTimeout(() => {
    if (!parado && !formas[atual].gira) {
      const olha = Math.random() < .35 ? 'translate(0px,0px)' : `translate(${Math.round((Math.random() - .5) * 10)}px,${Math.round((Math.random() - .5) * 5)}px)`;
      $('olhar').style.transform = olha;
      // sobrancelha acompanha: uma sobe, a outra desce (e troca na próxima olhada)
      lado = -lado;
      $('sobrancelhas').style.transform = olha === 'translate(0px,0px)' ? '' : `rotate(${lado * 5}deg) translateY(${Math.random() < .5 ? -2 : 0}px)`;
    } else { $('olhar').style.transform = ''; $('sobrancelhas').style.transform = ''; }
    passeiaOlhar();
  }, 1400 + Math.random() * 2200);
})();

function mostrar(nome, imediato) {
  const f = formas[nome]; atual = nome;
  document.documentElement.style.setProperty('--cor', f.cor);
  document.querySelectorAll('.acc').forEach(g => g.classList.toggle('on', f.acc.includes(g.dataset.acc)));
  $('forma').style.transform = f.corpo;
  $('forma').classList.toggle('treme', !!f.treme);
  $('forma').classList.toggle('nega', f.anim === 'nega');
  $('forma').classList.toggle('ri', f.anim === 'ri');
  for (const a of ['levita', 'cambaleia', 'varre', 'respira', 'balanca', 'encolhe', 'trocaOlho']) $('forma').classList.toggle(a, f.anim === a);
  if (imediato) desenharRosto(f);
  else { $('rosto').classList.add('troca'); setTimeout(() => { desenharRosto(f); $('rosto').classList.remove('troca'); }, 150); }
  $('formaNome').textContent = `${f.nome} · ${f.quando}`;
  falar(f.fala);
  document.querySelectorAll('#botoes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.forma === nome)));
}

const titulos = { humor:'Humores', carteira:'Momentos da Carteira', reacoes:'Reações da Carteira', estilos:'Jeitos de falar (a pessoa escolhe)', gemini:'Ideias do Gemini', jf2:'Funções da Carteira (ideias do JF)', perfil:'Pedidos do Code (Modo C.A.O.S. do Perfil)', gemini2:'Mecânicas novas (ideias do Gemini)' };
let grupoAtual = null;
const ordemGrupos = Object.keys(titulos);
const emOrdem = Object.entries(formas).sort((a, b) => ordemGrupos.indexOf(a[1].grupo || 'humor') - ordemGrupos.indexOf(b[1].grupo || 'humor'));
for (const [k, f] of emOrdem) {
  const g = f.grupo || 'humor';
  if (g !== grupoAtual) {
    grupoAtual = g;
    const t = document.createElement('p'); t.className = 'grupo'; t.textContent = titulos[g];
    $('botoes').appendChild(t);
  }
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = f.nome; b.dataset.forma = k;
  b.onclick = () => { pararPasseio(); mostrar(k); };
  $('botoes').appendChild(b);
}

let passeio = null;
function pararPasseio() { clearInterval(passeio); passeio = null; $('passear').textContent = '▶ Passear por todas'; }
$('passear').onclick = () => {
  if (passeio) return pararPasseio();
  const nomes = Object.keys(formas);
  $('passear').textContent = '⏸ Parar';
  passeio = setInterval(() => mostrar(nomes[(nomes.indexOf(atual) + 1) % nomes.length]), 2600);
};

// os pedacinhos do caos em volta
const NS = 'http://www.w3.org/2000/svg';
const CONFETE = ['#ffd24a', '#ff5fa2', '#3ef0ff', '#7dff8a', '#b06bff'];
const pedacos = Array.from({ length: 15 }, (_, i) => {
  const r = document.createElementNS(NS, 'rect');
  const t = 5 + (i % 3) * 3;
  r.setAttribute('width', t); r.setAttribute('height', t); r.setAttribute('rx', 1.5);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke-width', 2); r.setAttribute('filter', 'url(#brilho)');
  r.style.opacity = .35 + (i % 4) * .15;
  $('particulas').appendChild(r);
  return { el:r, t, ang: i * (Math.PI * 2 / 15), raio: 140 + (i % 5) * 12, vel: .003 + (i % 4) * .0015, giro: i * 37,
           x: 60 + (i * 53) % 280, y: (i * 41) % 400 };
});

const parado = matchMedia('(prefers-reduced-motion: reduce)').matches;
function quadro() {
  const f = formas[atual], modo = f.modo;
  const v = { calmo:1, lento:.35, agitado:2.6, festa:1.8, anel:.6, chuva:1, abraco:.25, bagunca:3, dormindo:.08, parado:0, dinheiro:1, medo:1.2 }[modo];
  const tremor = modo === 'agitado' ? 7 : modo === 'medo' ? 4 : 0;
  pedacos.forEach((p, i) => {
    p.el.style.stroke = modo === 'festa' ? CONFETE[i % CONFETE.length] : modo === 'dinheiro' ? '#4ade80' : f.cor;
    const nota = modo === 'dinheiro';
    if (p.nota !== nota) { p.nota = nota; p.el.setAttribute('width', nota ? 16 : p.t); p.el.setAttribute('height', nota ? 9 : p.t); }
    if (parado) return;
    p.ang += p.vel * v; p.giro += v * 1.5;
    let x, y;
    if (modo === 'chuva' || modo === 'dinheiro') {
      p.y += .6 + (i % 3) * .3; if (p.y > 400) p.y = 20;
      x = p.x; y = p.y;
    } else {
      const raio = modo === 'medo' ? 112 + (i % 3) * 5 : modo === 'festa' ? 150 : modo === 'anel' ? 165 : modo === 'abraco' ? 118 + (i % 3) * 6 : p.raio;
      const ang = modo === 'anel' ? (i * Math.PI * 2 / 15) + performance.now() / 4000 : p.ang;
      x = 200 + Math.cos(ang) * raio + (Math.random() - .5) * tremor;
      y = 212 + Math.sin(ang) * raio * (modo === 'anel' ? .35 : .8) + (Math.random() - .5) * tremor;
      p.x = x; p.y = y;
    }
    if (modo === 'bagunca') {
      if (Math.random() < .03) { p.bx = 40 + Math.random() * 320; p.by = 40 + Math.random() * 330; }
      if (p.bx !== undefined) { x = p.bx + (Math.random() - .5) * 3; y = p.by + (Math.random() - .5) * 3; }
    }
    p.el.setAttribute('transform', `translate(${x} ${y}) rotate(${modo === 'anel' ? 45 : p.giro})`);
  });
  if (atual === 'desnorteado' && !parado) {
    const t = performance.now() / 600;
    document.querySelectorAll('.tont').forEach((e, i) => {
      const a = t + i * 2.09;
      e.setAttribute('transform', `translate(${200 + Math.cos(a) * 62} ${112 + Math.sin(a) * 14}) scale(${.8 + (Math.sin(a) + 1) * .25})`);
    });
  }
  if (atual === 'simulador' && !parado) balancaQuadro();
  $('faisca').style.opacity = Math.random() < (modo === 'agitado' ? .5 : .15) ? 1 : .2;
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

// balança: trave sobe e desce, pratos ficam pendurados retinhos, moeda cai no prato mais baixo
const moedas = [];
let proximaMoeda = 0;
function balancaQuadro() {
  const agora = performance.now();
  const ang = Math.sin(agora / 900) * 0.16; // ~9 graus pra cada lado
  const dx = 54 * Math.cos(ang), dy = 54 * Math.sin(ang);
  $('trave').setAttribute('transform', `rotate(${ang * 180 / Math.PI} 200 78)`);
  const pE = { x: 200 - dx, y: 78 - dy }, pD = { x: 200 + dx, y: 78 + dy };
  $('pratoE').setAttribute('transform', `translate(${pE.x} ${pE.y})`);
  $('pratoD').setAttribute('transform', `translate(${pD.x} ${pD.y})`);
  if (agora > proximaMoeda) {
    proximaMoeda = agora + 700 + Math.random() * 500;
    const alvo = pD.y > pE.y ? 'D' : 'E';
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', '5.5'); c.setAttribute('fill', '#ffd400'); c.setAttribute('stroke', '#b8860b'); c.setAttribute('stroke-width', '1');
    $('moedasBal').appendChild(c);
    moedas.push({ el: c, lado: alvo, dxo: (Math.random() - .5) * 16, y: 20, vy: 0, parada: 0 });
  }
  for (let k = moedas.length - 1; k >= 0; k--) {
    const m = moedas[k], prato = m.lado === 'D' ? pD : pE;
    const fundo = prato.y + 30;
    if (!m.parada) {
      m.vy += 0.35; m.y += m.vy;
      if (m.y >= fundo) { m.y = fundo; m.vy *= -0.35; if (Math.abs(m.vy) < 0.6) m.parada = agora; }
    } else m.y = fundo; // acompanha o prato subindo e descendo
    m.el.setAttribute('cx', prato.x + m.dxo); m.el.setAttribute('cy', m.y);
    if (m.parada && agora - m.parada > 1200) { m.el.remove(); moedas.splice(k, 1); }
    else if (m.parada) m.el.setAttribute('opacity', String(1 - (agora - m.parada) / 1200));
  }
}

// piscar
(function piscar() {
  setTimeout(() => {
    if (!/Q/.test(formas[atual].olhoE.d) && !formas[atual].gira) { $('olhos').classList.add('pisca'); setTimeout(() => $('olhos').classList.remove('pisca'), 130); }
    piscar();
  }, 2500 + Math.random() * 2500);
})();

$('cena').onclick = () => {
  pararPasseio();
  mostrar('desnorteado');
  setTimeout(() => { if (atual === 'desnorteado') mostrar('recalculando'); }, 3800);

  while (g.firstChild) w.appendChild(g.firstChild);
  g.appendChild(w);
});

const pedida = new URLSearchParams(location.search).get('forma');
mostrar(formas[pedida] ? pedida : 'anjinho', true);
