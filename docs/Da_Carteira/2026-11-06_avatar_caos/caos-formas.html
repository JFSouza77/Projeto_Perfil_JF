<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C.A.O.S. formas</title>
<style>
  :root { --bg:#0b0d14; --cor:#3ef0ff; --texto:#e8ecf5; --suave:#8a93a8; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 35%, #161a2a 0, var(--bg) 70%); color:var(--texto);
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px; }
  h1 { font-size:20px; letter-spacing:.2em; margin:0 0 2px; color:var(--cor); text-shadow:0 0 12px var(--cor); transition:color .5s, text-shadow .5s; }
  .sub { color:var(--suave); font-size:13px; margin:0 0 4px; }
  .forma-nome { font-size:15px; font-weight:700; color:var(--cor); margin:0; min-height:20px; transition:color .5s; }
  svg { width:min(360px, 90vw); height:auto; overflow:visible; }
  #flutua { animation:boia 3.2s ease-in-out infinite; }
  @keyframes boia { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  #forma, .acc, #rosto { transform-box:fill-box; transform-origin:center; }
  #forma { transition:transform .7s cubic-bezier(.3,1.4,.5,1); }
  #forma.treme { animation:treme .18s linear infinite; }
  @keyframes treme { 0%{translate:0 0} 25%{translate:2px -1px} 50%{translate:-2px 1px} 75%{translate:1px 2px} 100%{translate:0 0} }
  .acc { opacity:0; transform:scale(.4); transition:opacity .45s, transform .6s cubic-bezier(.3,1.5,.5,1); }
  .acc.on { opacity:1; transform:scale(1); }
  #rosto { transition:opacity .15s; }
  #rosto.troca { opacity:0; }
  .neon { stroke:var(--cor); filter:url(#brilho); transition:stroke .5s, fill .5s; }
  #olhos { transform-box:fill-box; transform-origin:center; transition:transform .08s; }
  #olhos.pisca { transform:scaleY(.1); }
  #aureola { animation:aureola 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes aureola { 0%,100% { translate:0 0; } 50% { translate:0 -5px; } }
  .asa { transform-box:fill-box; animation:bate 1.4s ease-in-out infinite; }
  #asaE { transform-origin:right center; } #asaD { transform-origin:left center; }
  @keyframes bate { 0%,100% { rotate:0deg; } 50% { rotate:-12deg; } }
  #asaD { animation-name:bateD; } @keyframes bateD { 0%,100% { rotate:0deg; } 50% { rotate:12deg; } }
  .gota { animation:gota 1.1s linear infinite; }
  @keyframes gota { from { translate:0 0; opacity:1; } to { translate:0 34px; opacity:0; } }
  #lagrima { animation:lagrima 2.2s ease-in infinite; }
  @keyframes lagrima { 0% { translate:0 0; opacity:0; } 20% { opacity:1; } 100% { translate:0 26px; opacity:0; } }
  #raios { animation:pisca-sirene .5s steps(2) infinite; }
  @keyframes pisca-sirene { 50% { opacity:.1; } }
  #lampada-luz { animation:ideia 1.6s ease-in-out infinite; }
  @keyframes ideia { 50% { opacity:.35; } }
  #coracao { transform-box:fill-box; transform-origin:center; animation:pulsa 1.1s ease-in-out infinite; fill:color-mix(in srgb, var(--cor) 35%, transparent); }
  @keyframes pulsa { 0%,100% { scale:1; } 15% { scale:1.18; } 30% { scale:1; } 45% { scale:1.12; } }
  #despertador { transform-box:fill-box; transform-origin:center bottom; animation:toca 1.6s ease-in-out infinite; }
  @keyframes toca { 0%,40%,100% { rotate:0deg; } 5%,15%,25%,35% { rotate:-12deg; } 10%,20%,30% { rotate:12deg; } }
  .grupo { width:100%; text-align:center; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--suave); margin:8px 0 0; }
  #moeda { animation:moeda 1.8s ease-in infinite; }
  @keyframes moeda { 0% { translate:0 -10px; opacity:0; } 20% { opacity:1; } 70% { translate:0 30px; opacity:1; } 100% { translate:0 32px; opacity:0; } }
  .fedor { animation:fedor 2s ease-in-out infinite; }
  @keyframes fedor { 0% { translate:0 6px; opacity:0; } 40% { opacity:1; } 100% { translate:0 -10px; opacity:0; } }
  #suor { animation:suor 2.4s ease-in infinite; }
  @keyframes suor { 0% { translate:0 0; opacity:0; } 20% { opacity:1; } 100% { translate:0 22px; opacity:0; } }
  #pupilas { animation:treme .12s linear infinite; }
  #forma.nega { animation:nega 1.6s ease-in-out infinite; }
  @keyframes nega { 0%,60%,100% { translate:0 0; } 10%,30%,50% { translate:-6px 0; } 20%,40% { translate:6px 0; } }
  #lupa { transform-box:fill-box; transform-origin:center; animation:lupa 3s ease-in-out infinite; }
  @keyframes lupa { 0%,100% { translate:0 0; } 50% { translate:-4px 3px; } }
  #joinha { transform-box:fill-box; transform-origin:center bottom; animation:joinha 1.8s ease-in-out infinite; }
  @keyframes joinha { 0%,70%,100% { rotate:0deg; } 80% { rotate:-10deg; } 90% { rotate:6deg; } }
  .fala { margin:4px 0 14px; max-width:340px; background:#151a28; border:1px solid #262d42; border-radius:14px;
    padding:12px 14px; font-size:15px; line-height:1.4; min-height:48px; text-align:center; }
  .botoes { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:420px; }
  button { background:#151a28; color:var(--texto); border:1px solid #2a3148; border-radius:999px; padding:10px 14px;
    font-size:15px; min-height:44px; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--cor); box-shadow:0 0 10px var(--cor); }
  #passear { margin-top:10px; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; } #forma { transition:none; } }
</style>
</head>

const $ = id => document.getElementById(id);
let atual = 'anjinho';

function desenharRosto(f) {
  for (const lado of ['olhoE', 'olhoD']) {
    $(lado).setAttribute('d', f[lado].d);
    $(lado).style.fill = f[lado].cheio ? f.cor : 'none';
  }
  $('sobrancelhas').setAttribute('d', f.sob || 'M0 0');
  $('sobrancelhas').style.display = f.sob ? '' : 'none';
  $('boca').setAttribute('d', f.boca || 'M0 0');
  $('boca').style.display = f.boca ? '' : 'none';
  $('boca').style.fill = f.boca.endsWith('Z') ? '#0f1320' : 'none';
  $('extra').textContent = f.extra;
}

function mostrar(nome, imediato) {
  const f = formas[nome]; atual = nome;
  document.documentElement.style.setProperty('--cor', f.cor);
  document.querySelectorAll('.acc').forEach(g => g.classList.toggle('on', f.acc.includes(g.dataset.acc)));
  $('forma').style.transform = f.corpo;
  $('forma').classList.toggle('treme', !!f.treme);
  $('forma').classList.toggle('nega', f.anim === 'nega');
  if (imediato) desenharRosto(f);
  else { $('rosto').classList.add('troca'); setTimeout(() => { desenharRosto(f); $('rosto').classList.remove('troca'); }, 150); }
  $('formaNome').textContent = `${f.nome} · ${f.quando}`;
  $('fala').textContent = f.fala;
  document.querySelectorAll('#botoes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.forma === nome)));
}

const titulos = { humor:'Humores', carteira:'Momentos da Carteira', reacoes:'Reações da Carteira' };
let grupoAtual = null;
for (const [k, f] of Object.entries(formas)) {
  const g = f.grupo || 'humor';
  if (g !== grupoAtual) {
    grupoAtual = g;
    const t = document.createElement('p'); t.className = 'grupo'; t.textContent = titulos[g];
    $('botoes').appendChild(t);
  }
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = f.nome; b.dataset.forma = k;
  b.onclick = () => { pararPasseio(); mostrar(k); };
  $('botoes').appendChild(b);
}

let passeio = null;
function pararPasseio() { clearInterval(passeio); passeio = null; $('passear').textContent = '▶ Passear por todas'; }
$('passear').onclick = () => {
  if (passeio) return pararPasseio();
  const nomes = Object.keys(formas);
  $('passear').textContent = '⏸ Parar';
  passeio = setInterval(() => mostrar(nomes[(nomes.indexOf(atual) + 1) % nomes.length]), 2600);
};

// os pedacinhos do caos em volta
const NS = 'http://www.w3.org/2000/svg';
const CONFETE = ['#ffd24a', '#ff5fa2', '#3ef0ff', '#7dff8a', '#b06bff'];
const pedacos = Array.from({ length: 15 }, (_, i) => {
  const r = document.createElementNS(NS, 'rect');
  const t = 5 + (i % 3) * 3;
  r.setAttribute('width', t); r.setAttribute('height', t); r.setAttribute('rx', 1.5);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke-width', 2); r.setAttribute('filter', 'url(#brilho)');
  r.style.opacity = .35 + (i % 4) * .15;
  $('particulas').appendChild(r);
  return { el:r, t, ang: i * (Math.PI * 2 / 15), raio: 140 + (i % 5) * 12, vel: .003 + (i % 4) * .0015, giro: i * 37,
           x: 60 + (i * 53) % 280, y: (i * 41) % 400 };
});

const parado = matchMedia('(prefers-reduced-motion: reduce)').matches;
function quadro() {
  const f = formas[atual], modo = f.modo;
  const v = { calmo:1, lento:.35, agitado:2.6, festa:1.8, anel:.6, chuva:1, abraco:.25, parado:0, dinheiro:1, medo:1.2 }[modo];
  const tremor = modo === 'agitado' ? 7 : modo === 'medo' ? 4 : 0;
  pedacos.forEach((p, i) => {
    p.el.style.stroke = modo === 'festa' ? CONFETE[i % CONFETE.length] : modo === 'dinheiro' ? '#4ade80' : f.cor;
    const nota = modo === 'dinheiro';
    if (p.nota !== nota) { p.nota = nota; p.el.setAttribute('width', nota ? 16 : p.t); p.el.setAttribute('height', nota ? 9 : p.t); }
    if (parado) return;
    p.ang += p.vel * v; p.giro += v * 1.5;
    let x, y;
    if (modo === 'chuva' || modo === 'dinheiro') {
      p.y += .6 + (i % 3) * .3; if (p.y > 400) p.y = 20;
      x = p.x; y = p.y;
    } else {
      const raio = modo === 'medo' ? 112 + (i % 3) * 5 : modo === 'festa' ? 150 : modo === 'anel' ? 165 : modo === 'abraco' ? 118 + (i % 3) * 6 : p.raio;
      const ang = modo === 'anel' ? (i * Math.PI * 2 / 15) + performance.now() / 4000 : p.ang;
      x = 200 + Math.cos(ang) * raio + (Math.random() - .5) * tremor;
      y = 212 + Math.sin(ang) * raio * (modo === 'anel' ? .35 : .8) + (Math.random() - .5) * tremor;
      p.x = x; p.y = y;
    }
    p.el.setAttribute('transform', `translate(${x} ${y}) rotate(${modo === 'anel' ? 45 : p.giro})`);
  });
  $('faisca').style.opacity = Math.random() < (modo === 'agitado' ? .5 : .15) ? 1 : .2;
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

// piscar
(function piscar() {
  setTimeout(() => {
    if (formas[atual].olhoE.cheio) { $('olhos').classList.add('pisca'); setTimeout(() => $('olhos').classList.remove('pisca'), 130); }
    piscar();
  }, 2500 + Math.random() * 2500);
})();

const pedida = new URLSearchParams(location.search).get('forma');
mostrar(formas[pedida] ? pedida : 'anjinho', true);
